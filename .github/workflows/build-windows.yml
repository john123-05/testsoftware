name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EXE
        run: powershell -ExecutionPolicy Bypass -File scripts\build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: liftpic-sync-windows
          path: dist/liftpic-sync.exe

      # Liftpictures Display (Presentation + Station als eigenes Programm).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Liftpictures Display
        run: dotnet publish display_app\LiftpicturesDisplay.csproj -c Release -o dist\display
      - name: Zip Liftpictures Display
        shell: pwsh
        run: |
          Get-ChildItem dist\display
          Compress-Archive -Path dist\display\* -DestinationPath dist\LiftpicturesDisplay.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: liftpictures-display
          path: dist/LiftpicturesDisplay.zip
      # Oeffentlicher Download fuer die PCs (scripts/display_einrichten.ps1).
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes "Liftpic Sync $env:GITHUB_REF_NAME" }
          gh release upload $env:GITHUB_REF_NAME dist\LiftpicturesDisplay.zip --clobber
